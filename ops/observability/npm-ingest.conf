# Nginx Proxy Manager "Advanced" configuration for the SigNoz ingest host.
# NPM pastes this into the server block, so only server/location directives are valid here.
# Requires a bearer token and exposes only the two OTLP/HTTP signal paths.
# Replace REPLACE_WITH_TOKEN with the value generated per ops/observability/README.md.

location = /v1/traces {
    if ($http_authorization != "Bearer REPLACE_WITH_TOKEN") { return 401; }
    client_max_body_size 8m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_pass http://signoz-aio:4318;
}

location = /v1/metrics {
    if ($http_authorization != "Bearer REPLACE_WITH_TOKEN") { return 401; }
    client_max_body_size 8m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_pass http://signoz-aio:4318;
}

location / {
    return 404;
}
